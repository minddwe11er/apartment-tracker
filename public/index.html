<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Квартиры — трекер</title>
<script>
  // Ставимо тему до відмальовки, щоб не блимало.
  try { const t = localStorage.getItem("apt-theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch {}
</script>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏠</text></svg>">
<style>
  :root {
    --bg: #f7f6f3;
    --card-bg: #ffffff;
    --text: #1f1d1b;
    --text-muted: #6b6560;
    --border: #e5e1da;
    --accent: #b5651d;
    --accent-soft: #f0e2d3;
    --status-noted: #9c9691;
    --status-contacted: #4a7fb5;
    --status-called: #b58a1d;
    --status-responded: #3f9d5e;
    --status-viewing: #2a8f8f;
    --status-viewed: #7a4ab5;
    --status-applied: #b04a8f;
    --star: #d99a00;
    --status-declined: #b5504a;
    --status-success: #2f8f5b;
    --radius: 14px;
    --shadow: 0 1px 2px rgba(0,0,0,0.04), 0 4px 12px rgba(0,0,0,0.05);
  }
  :root { color-scheme: light; }
  /* Тема: data-theme="light" | "dark" на <html>; без атрибута — як у системі. */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #1a1816;
      --card-bg: #24211e;
      --text: #ece8e2;
      --text-muted: #a39d95;
      --border: #383430;
      --accent: #e0975a;
      --accent-soft: #3a2e22;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #1a1816;
    --card-bg: #24211e;
    --text: #ece8e2;
    --text-muted: #a39d95;
    --border: #383430;
    --accent: #e0975a;
    --accent-soft: #3a2e22;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
    padding: 20px 16px 60px;
  }
  .wrap { max-width: 1520px; margin: 0 auto; }
  /* Колонки: 1 на телефоні, 2 від 640px, 3 від 980px, 4 від 1280px */
  #list { display: grid; grid-template-columns: 1fr; gap: 14px; align-items: start; }
  @media (min-width: 640px)  { #list { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (min-width: 980px)  { #list { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  @media (min-width: 1280px) { #list { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
  #list > .empty { grid-column: 1 / -1; }
  .add-wrap { max-width: 640px; }
  header { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  h1 { font-size: 22px; font-weight: 700; margin: 4px 0; }
  .subtitle { color: var(--text-muted); font-size: 13px; margin-bottom: 18px; }
  .header-actions { display: flex; gap: 6px; flex-shrink: 0; margin-top: 2px; }
  .theme-btn { padding: 9px 11px; font-size: 16px; line-height: 1; }
  .lang-select {
    width: auto;
    padding: 8px 8px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: transparent;
    color: var(--text-muted);
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  .lang-select:hover { color: var(--text); }
  /* На вузькому екрані кнопка входу — лише значок, щоб шапка вміщалась будь-якою мовою */
  @media (max-width: 480px) { .lock-btn .lock-text { display: none; } .lock-btn { padding: 9px 11px; } }
  .banner {
    display: none;
    font-size: 13px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 10px 14px;
    margin-bottom: 14px;
  }
  .banner.show { display: block; }
  .banner.error { border-color: var(--status-declined); color: var(--status-declined); font-weight: 600; }

  .panel {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 16px;
    margin-bottom: 18px;
  }
  .add-toggle { margin-bottom: 16px; }
  .panel-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .panel-head h2 { margin: 0 !important; }
  .btn-sm { padding: 5px 10px; font-size: 13px; }
  .panel[hidden] { display: none; }
  .panel h2 { font-size: 15px; margin: 0 0 12px; font-weight: 600; }
  .row { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
  .row > * { flex: 1; min-width: 120px; }
  input, textarea, select {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 9px 11px;
    font-size: 16px;
    color: var(--text);
    font-family: inherit;
  }
  input:focus, textarea:focus, select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  textarea { resize: vertical; min-height: 40px; }
  button {
    cursor: pointer;
    border: none;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 600;
    padding: 9px 16px;
    font-family: inherit;
  }
  button:disabled { opacity: 0.5; cursor: default; }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-ghost { background: transparent; color: var(--text-muted); border: 1px solid var(--border); }
  .btn-ghost:hover { color: var(--text); }
  .btn-danger { background: transparent; color: var(--status-declined); }
  .add-photo { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  .thumb { position: relative; width: 64px; height: 64px; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; border-radius: 10px; border: 1px solid var(--border); display: block; }
  .thumb button {
    position: absolute; top: -6px; right: -6px;
    width: 22px; height: 22px; padding: 0;
    border-radius: 50%;
    background: var(--status-declined); color: #fff;
    font-size: 13px; line-height: 22px;
  }

  .filters { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
  .chip {
    --c: var(--text-muted);
    display: inline-flex;
    align-items: center;
    gap: 7px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 5px 6px 5px 11px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 600;
    line-height: 1.2;
    transition: background .15s, border-color .15s, color .15s;
  }
  .chip:hover { border-color: var(--c); }
  .chip .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c); flex-shrink: 0; }
  .chip .count {
    min-width: 22px;
    padding: 2px 7px;
    border-radius: 999px;
    background: var(--bg);
    color: var(--text-muted);
    font-size: 12px;
    font-weight: 700;
    text-align: center;
  }
  .chip.active { background: var(--c); border-color: var(--c); color: #fff; }
  .chip.active .dot { background: #fff; }
  .chip.active .count { background: rgba(255,255,255,.25); color: #fff; }

  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 14px 16px;
    margin-bottom: 0;
  }
  /* Обрані квартири: легкий відтінок кольору зірочки */
  .card.approved {
    background: color-mix(in srgb, var(--star) 9%, var(--card-bg));
    border-color: color-mix(in srgb, var(--star) 45%, var(--border));
  }
  /* Відсіяні квартири: приглушені й сірі, але лишаються в списку */
  .card.rejected:not(.editing) { opacity: .5; transition: opacity .15s; }
  .card.rejected:not(.editing):hover { opacity: .8; }
  .card.rejected .photo { filter: grayscale(1); }
  .card.rejected .addr { text-decoration-line: line-through; text-decoration-color: var(--text-muted); }
  .rejected-mark { color: var(--text-muted); font-size: 14px; margin-right: 5px; display: inline-block; font-weight: 800; }
  .rejectBtn.on { color: var(--text); border-color: var(--text-muted); background: var(--bg); }
  .star { color: var(--star); font-size: 16px; margin-right: 5px; line-height: 1; display: inline-block; text-decoration: none; }
  .approveBtn.on { color: var(--star); border-color: var(--star); }

  .to-top {
    position: fixed;
    right: 16px;
    bottom: calc(16px + env(safe-area-inset-bottom));
    width: 46px; height: 46px;
    padding: 0;
    border-radius: 50%;
    background: var(--accent); color: #fff;
    font-size: 22px; line-height: 1;
    box-shadow: 0 4px 14px rgba(0,0,0,.25);
    opacity: 0; transform: translateY(12px); pointer-events: none;
    transition: opacity .2s, transform .2s;
    z-index: 10;
  }
  .to-top.show { opacity: 1; transform: none; pointer-events: auto; }
  .card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .gallery {
    position: relative;
    margin-bottom: 10px;
    border-radius: 10px;
    overflow: hidden;
    background: var(--bg);
    touch-action: pan-y;
    user-select: none;
  }
  .photo {
    width: 100%;
    height: 220px;
    object-fit: cover;
    display: block;
  }
  .gallery .nav {
    position: absolute;
    top: 0;
    bottom: 0;
    width: 30%;
    padding: 0 10px;
    background: transparent;
    border-radius: 0;
    display: flex;
    align-items: center;
    color: #fff;
    -webkit-tap-highlight-color: transparent;
  }
  .gallery .nav.prev { left: 0; justify-content: flex-start; }
  .gallery .nav.next { right: 0; justify-content: flex-end; }
  .gallery .nav span {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: rgba(0,0,0,.45);
    display: grid;
    place-items: center;
    font-size: 22px;
    line-height: 1;
    padding-bottom: 2px;
    opacity: .75;
    transition: opacity .15s, background .15s;
  }
  .gallery .nav:hover span, .gallery .nav:focus-visible span { opacity: 1; background: rgba(0,0,0,.65); }
  .gallery .dots {
    position: absolute;
    left: 50%;
    bottom: 8px;
    transform: translateX(-50%);
    display: flex;
    gap: 5px;
    padding: 4px 7px;
    border-radius: 999px;
    background: rgba(0,0,0,.35);
    pointer-events: none;
  }
  .gallery .dots i { width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,.5); }
  .gallery .dots i.on { background: #fff; }
  .addr-row { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .addr { font-weight: 700; font-size: 15px; word-break: break-word; }
  .price-tag { font-size: 17px; font-weight: 800; color: var(--accent); white-space: nowrap; }
  .meta-line { font-size: 12.5px; color: var(--text-muted); margin-top: 2px; }
  .addr-link { color: inherit; text-decoration: none; }
  .addr-link .addr { text-decoration: underline; text-decoration-color: var(--border); text-underline-offset: 3px; text-decoration-thickness: 2px; transition: text-decoration-color .15s, color .15s; }
  .addr-link:hover .addr { color: var(--accent); text-decoration-color: var(--accent); }
  .addr-link .ext { margin-left: 4px; font-size: 13px; color: var(--accent); font-weight: 700; }
  .gallery .photo { cursor: zoom-in; }

  /* Перегляд фото на весь екран */
  .lightbox {
    width: 100vw; height: 100dvh; max-width: none; max-height: none;
    margin: 0; padding: 0; border: 0;
    background: #0d0c0b; color: #fff;
    overscroll-behavior: contain;
  }
  .lightbox::backdrop { background: rgba(0,0,0,.6); }
  .lightbox[open] { display: flex; flex-direction: column; }
  .lb-top {
    display: flex; justify-content: space-between; align-items: center; gap: 12px;
    padding: calc(10px + env(safe-area-inset-top)) 16px 10px;
    font-size: 14px; font-weight: 600;
  }
  .lb-title { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; opacity: .85; }
  .lb-count { opacity: .7; font-variant-numeric: tabular-nums; flex-shrink: 0; }
  .lb-stage { position: relative; flex: 1; min-height: 0; display: grid; place-items: center; touch-action: pan-y; user-select: none; }
  .lb-stage img { max-width: 100%; max-height: 100%; object-fit: contain; display: block; }
  .lb-btn {
    width: 44px; height: 44px; padding: 0; border-radius: 50%;
    background: rgba(255,255,255,.14); color: #fff;
    font-size: 26px; line-height: 1;
    display: grid; place-items: center;
  }
  .lb-btn:hover, .lb-btn:focus-visible { background: rgba(255,255,255,.28); }
  .lb-close { font-size: 22px; flex-shrink: 0; }
  .lb-nav { position: absolute; top: 50%; transform: translateY(-50%); }
  .lb-prev { left: 12px; }
  .lb-next { right: 12px; }
  .lb-thumbs {
    display: flex; gap: 6px; justify-content: center; overflow-x: auto;
    padding: 10px 16px calc(12px + env(safe-area-inset-bottom));
  }
  .lb-thumbs button { padding: 0; border-radius: 6px; background: none; flex-shrink: 0; opacity: .5; border: 2px solid transparent; }
  .lb-thumbs button.on { opacity: 1; border-color: #fff; }
  .lightbox [hidden] { display: none !important; }
  .lb-thumbs img { width: 52px; height: 52px; object-fit: cover; border-radius: 4px; display: block; }
  .badge {
    font-size: 11px;
    font-weight: 700;
    padding: 3px 9px;
    border-radius: 999px;
    color: #fff;
    max-width: 45%;
    flex-shrink: 0;
    text-align: center;
    line-height: 1.3;
    text-wrap: balance;
  }
  .edit-box { margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--border); }
  .edit-box .card-controls { margin-top: 0; }
  .fields-box { display: grid; grid-template-columns: 1fr 110px; gap: 8px; margin-bottom: 8px; }
  .fields-box .field-address { grid-column: 1 / -1; }
  .fields-box input { font-size: 14px; min-width: 0; }
  .edit-footer { display: flex; justify-content: flex-end; margin-top: 6px; }
  .notes-view { margin-top: 8px; font-size: 13.5px; white-space: pre-wrap; }
  .card-controls { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .card-controls select { max-width: 230px; }
  .notes-box { margin-top: 8px; }
  .notes-box textarea { font-size: 14px; }
  .card-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; }
  .updated-at { font-size: 11px; color: var(--text-muted); }
  .empty { text-align: center; color: var(--text-muted); font-size: 14px; padding: 40px 10px; }
  .readonly .edit-only { display: none !important; }
</style>
</head>
<body>
<div class="wrap readonly" id="app">
  <header>
    <div>
      <h1 data-i18n="appTitle">🏠 Квартиры</h1>
      <div class="subtitle" id="subtitle" data-i18n="subtitle">Общий список</div>
    </div>
    <div class="header-actions">
      <select class="lang-select" id="langSelect" data-i18n-aria="language"></select>
      <button type="button" class="btn-ghost theme-btn" id="btnTheme" aria-label="Тема" title="Тема">🌓</button>
      <button class="btn-ghost lock-btn" id="btnLock" style="visibility:hidden"><span aria-hidden="true">🔒</span> <span class="lock-text">Войти</span></button>
    </div>
  </header>

  <div class="banner" id="banner"></div>

  <form class="panel" id="loginPanel" style="display:none">
    <h2 data-i18n="loginTitle">Пароль для редактирования</h2>
    <div class="row">
      <input id="inPassword" type="password" autocomplete="current-password" placeholder="Пароль" data-i18n-ph="password" />
      <button class="btn-primary" type="submit" style="flex:0" data-i18n="loginBtn">Войти</button>
    </div>
  </form>

  <div class="add-wrap edit-only">
  <button type="button" class="btn-primary add-toggle" id="btnShowAdd" data-i18n="addOpen">＋ Добавить квартиру</button>
  <div class="panel" id="addPanel" hidden>
    <div class="panel-head">
      <h2 data-i18n="addTitle">Добавить квартиру</h2>
      <button type="button" class="btn-ghost btn-sm" id="btnHideAdd" aria-label="Свернуть" data-i18n-aria="collapse">✕</button>
    </div>
    <div class="row">
      <input id="inAddress" placeholder="Адрес / название" data-i18n-ph="phAddress" autocomplete="off" />
    </div>
    <div class="row">
      <input id="inLink" placeholder="Ссылка на объявление" data-i18n-ph="phLink" autocomplete="off" />
      <input id="inPrice" placeholder="Цена (например 1450)" data-i18n-ph="phPrice" autocomplete="off" />
    </div>
    <div class="row">
      <textarea id="inNotes" placeholder="Заметка (необязательно)" data-i18n-ph="phNotesAdd"></textarea>
    </div>
    <div class="add-photo" id="addPhoto">
      <div id="addThumbs" style="display:contents"></div>
      <button type="button" class="btn-ghost" id="btnAddPhoto">📷 Добавить фото</button>
      <input type="file" accept="image/*" multiple id="inPhoto" hidden />
    </div>
    <button class="btn-primary" id="btnAdd" data-i18n="add">Добавить</button>
  </div>
  </div>

  <div class="filters" id="filters"></div>
  <div id="list"><div class="empty" data-i18n="loading">Загрузка…</div></div>
</div>

<button type="button" class="to-top" id="toTop" aria-label="Наверх" data-i18n-aria="toTop">↑</button>

<dialog class="lightbox" id="lightbox" aria-label="Фото квартиры" data-i18n-aria="lightbox">
  <div class="lb-top">
    <span class="lb-title" id="lbTitle"></span>
    <span class="lb-count" id="lbCount"></span>
    <button type="button" class="lb-btn lb-close" id="lbClose" aria-label="Закрыть" data-i18n-aria="close">✕</button>
  </div>
  <div class="lb-stage" id="lbStage">
    <img id="lbImg" alt="" draggable="false" />
    <button type="button" class="lb-btn lb-nav lb-prev" id="lbPrev" aria-label="Предыдущее фото" data-i18n-aria="prevPhoto">‹</button>
    <button type="button" class="lb-btn lb-nav lb-next" id="lbNext" aria-label="Следующее фото" data-i18n-aria="nextPhoto">›</button>
  </div>
  <div class="lb-thumbs" id="lbThumbs"></div>
</dialog>

<script>
// Мови інтерфейсу. Дані (адреси, нотатки) не перекладаються.
const LANGS = [
  { id: "ru", label: "RU", name: "Русский",    locale: "ru-RU" },
  { id: "uk", label: "UA", name: "Українська", locale: "uk-UA" },
  { id: "de", label: "DE", name: "Deutsch",    locale: "de-CH" },
  { id: "en", label: "EN", name: "English",    locale: "en-GB" },

const I18N = {
  ru: {

    addPhoto: "📷 Добавить фото", morePhoto: "📷 Ещё фото", removeThumb: "Убрать фото",
    loading: "Загрузка…", toTop: "Наверх", lightbox: "Фото квартиры", close: "Закрыть",
    prevPhoto: "Предыдущее фото", nextPhoto: "Следующее фото", openPhoto: "Открыть фото", photoN: "Фото {n}",
    "status.noted": "На рассмотрении", "status.contacted": "Написали", "status.called": "Позвонили", "status.responded": "Есть ответ",

    statusLabel: "Статус", filterAll: "Актуально", filterApproved: "★ Подходят", filterRejected: "✕ Отсеянные",
    fit: "Подходит", approveOn: "★ Подходит", approveOff: "☆ Подходит", rejectedMark: "Отсеяли", rejectOn: "✕ Отсеяли", rejectOff: "✕ Не подходит",

let lang = (() => { try { const l = localStorage.getItem("apt-lang"); return I18N[l] ? l : "ru"; } catch { return "ru"; } })();
function t(key, params = {}) {
  const s = I18N[lang][key] ?? I18N.ru[key] ?? key;
  return s.replace(/\{(\w+)\}/g, (_, k) => params[k] ?? "");
}
const locale = () => (LANGS.find(l => l.id === lang) || LANGS[0]).locale;
// Статичні тексти розмітки: data-i18n (текст), data-i18n-ph (placeholder), data-i18n-aria (aria-label + title).
function applyStaticI18n() {
  document.documentElement.lang = lang;
  document.title = t("docTitle");
  document.querySelectorAll("[data-i18n]").forEach(el => el.textContent = t(el.dataset.i18n));
  document.querySelectorAll("[data-i18n-ph]").forEach(el => el.placeholder = t(el.dataset.i18nPh));
  document.querySelectorAll("[data-i18n-aria]").forEach(el => { el.setAttribute("aria-label", t(el.dataset.i18nAria)); });
}

const STATUSES = [
  { id: "noted", get label() { return t("status.noted"); }, color: "var(--status-noted)" },
  { id: "contacted", get label() { return t("status.contacted"); },        color: "var(--status-contacted)" },
  { id: "called", get label() { return t("status.called"); },       color: "var(--status-called)" },
  { id: "responded", get label() { return t("status.responded"); },      color: "var(--status-responded)" },
  { id: "viewing", get label() { return t("status.viewing"); }, color: "var(--status-viewing)" },
  { id: "viewed", get label() { return t("status.viewed"); },      color: "var(--status-viewed)" },
  { id: "applied", get label() { return t("status.applied"); }, color: "var(--status-applied)" },
  { id: "success", get label() { return t("status.success"); },          color: "var(--status-success)" },
];
const statusMap = Object.fromEntries(STATUSES.map(s => [s.id, s]));
const POLL_MS = 15000;

const $ = (sel) => document.querySelector(sel);
const app = $("#app"), listEl = $("#list"), filtersEl = $("#filters"), bannerEl = $("#banner");

let apartments = [];
let activeFilter = "all";
let canEdit = false;
let editingNotes = null; // id картки, де зараз друкують — не перемальовуємо її під час опитування

const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch {} },
};
let password = store.get("apt-password") || "";

function showBanner(text, isError = false) {
  if (!text) { bannerEl.classList.remove("show"); return; }
  bannerEl.textContent = text;
  bannerEl.classList.toggle("error", isError);
  bannerEl.classList.add("show");
}

function escapeHtml(str) {
  return String(str || "").replace(/[&<>"']/g, (c) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}
function safeUrl(u) { return /^(https?:\/\/|\/)/i.test(u || "") ? u : ""; }

async function api(path, opts = {}) {
  const headers = { ...(opts.headers || {}) };
  if (password) headers["x-password"] = password;
  const res = await fetch(path, { ...opts, headers });
  const data = await res.json().catch(() => ({}));
  if (res.status === 401) { setEditMode(false); throw new Error(t("wrongPasswordRelogin")); }
  if (!res.ok) throw new Error((data.code && I18N[lang]["err." + data.code]) || data.error || t("errorStatus", { s: res.status }));
  return data;
}

function updateModeTexts() {
  const lockLabel = canEdit ? t("logout") : t("login");
  $("#btnLock").innerHTML = `<span aria-hidden="true">${canEdit ? "🔓" : "🔒"}</span> <span class="lock-text">${lockLabel}</span>`;
  $("#btnLock").setAttribute("aria-label", lockLabel);
  $("#btnLock").title = lockLabel;
  $("#subtitle").textContent = canEdit ? t("subtitleEdit") : t("subtitleView");
}

function setEditMode(on) {
  canEdit = on;
  app.classList.toggle("readonly", !on);
  updateModeTexts();
  renderList();
}

async function checkAuth() {
  try {
    const r = await api("/api/auth");
    if (!r.required) {
      $("#btnLock").style.display = "none";
      setEditMode(true);
      showBanner(t("noPassword"), true);
      return;
    }
    $("#btnLock").style.visibility = "visible";
    setEditMode(r.ok && !!password);
  } catch {
    $("#btnLock").style.visibility = "visible";
    setEditMode(false);
  }
}

$("#btnLock").addEventListener("click", () => {
  if (canEdit) {
    password = ""; store.set("apt-password", null); setEditMode(false);
  } else {
    const p = $("#loginPanel");
    p.style.display = p.style.display === "none" ? "block" : "none";
    $("#inPassword").focus();
  }
});
$("#loginPanel").addEventListener("submit", async (e) => {
  e.preventDefault();
  password = $("#inPassword").value;
  const r = await api("/api/auth").catch(() => ({ ok: false }));
  if (r.ok) {
    store.set("apt-password", password);
    $("#loginPanel").style.display = "none";
    $("#inPassword").value = "";
    showBanner("");
    setEditMode(true);
  } else {
    password = "";
    showBanner(t("wrongPassword"), true);
  }
});

function renderFilters() {
  const active = apartments.filter(a => !a.rejected); // відсіяні рахуються лише в «Отсеянные»
  const counts = { all: active.length, approved: active.filter(a => a.approved).length, rejected: apartments.length - active.length };
  STATUSES.forEach(s => counts[s.id] = active.filter(a => a.status === s.id).length);
  // Порожні статуси не показуємо, щоб список був коротким (крім активного).
  const chips = [{ id: "all", label: t("filterAll"), color: "var(--accent)" }, { id: "approved", label: t("filterApproved"), color: "var(--star)" }, ...STATUSES, { id: "rejected", label: t("filterRejected"), color: "var(--text-muted)" }]
    .filter(c => c.id === "all" || counts[c.id] || c.id === activeFilter);
  filtersEl.innerHTML = chips.map(c => `
    <button type="button" class="chip ${activeFilter === c.id ? "active" : ""}" data-filter="${c.id}" style="--c:${c.color}" aria-pressed="${activeFilter === c.id}">
      ${["all", "approved", "rejected"].includes(c.id) ? "" : `<span class="dot"></span>`}${c.label}<span class="count">${counts[c.id] || 0}</span>
    </button>`).join("");
  filtersEl.querySelectorAll(".chip").forEach(chip => chip.addEventListener("click", () => {
    activeFilter = chip.dataset.filter;
    renderFilters(); renderList();
  }));
}

// Картка, відкрита на редагування, лишається там, де була при відкритті:
// фільтр дивиться на її стан на момент «Изменить», тож «Не подходит»,
// «Подходит» чи новий статус ховають її з поточної категорії лише після «Готово».
function placed(a) {
  return canEdit && editingCards.has(a.id) ? editingCards.get(a.id) : a;
}

function renderList() {
  const items = apartments.filter(a => {
    const p = placed(a);
    // Відсіяні видно лише в «Отсеянные»; в усіх інших категоріях їх немає.
    if (activeFilter === "rejected") return p.rejected;
    if (p.rejected) return false;
    return activeFilter === "all" ? true
      : activeFilter === "approved" ? p.approved
      : p.status === activeFilter;
  });
  if (!items.length) {
    listEl.innerHTML = `<div class="empty">${apartments.length ? t("emptyFilter") : t("emptyAll")}</div>`;
    return;
  }
  listEl.innerHTML = items.map(a => {
    const st = statusMap[a.status] || statusMap.noted;
    const updated = a.updatedAt ? new Date(a.updatedAt).toLocaleString(locale(), { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" }) : "";
    const link = safeUrl(a.link);
    const photos = photosOf(a);
    const idx = Math.min(galleryIndex.get(a.id) || 0, Math.max(photos.length - 1, 0));
    const ext =(inner, cls = "") => link ? `<a class="${cls}" href="${escapeHtml(link)}" target="_blank" rel="noopener">${inner}</a>` : inner;
    let site = "";
    try { site = link ? new URL(link, location.href).hostname.replace(/^(www|en|de|fr|it)\./, "") : ""; } catch {}
    const addrText = escapeHtml(a.address) || (site ? escapeHtml(t("listingOn", { site })) : t("noAddress"));
    return `
    <div class="card ${a.approved ? "approved" : ""} ${a.rejected ? "rejected" : ""} ${editingCards.has(a.id) ? "editing" : ""}" data-id="${escapeHtml(a.id)}">
      ${photos.length ? `
      <div class="gallery">
        <img class="photo" src="${escapeHtml(photos[idx])}" alt="${t("openPhoto")}" loading="lazy" draggable="false" />
        ${photos.length > 1 ? `
        <button type="button" class="nav prev" aria-label="${t("prevPhoto")}"><span>‹</span></button>
        <button type="button" class="nav next" aria-label="${t("nextPhoto")}"><span>›</span></button>
        <div class="dots">${photos.map((_, i) => `<i class="${i === idx ? "on" : ""}"></i>`).join("")}</div>` : ""}
      </div>` : ""}
      <div class="card-top">
        <div>
          <div class="addr-row">
            ${ext(`<span class="addr">${a.approved ? `<span class="star" title="${t("fit")}" aria-label="${t("fit")}">★</span>` : ""}${a.rejected ? `<span class="rejected-mark" title="${t("rejectedMark")}" aria-label="${t("rejectedMark")}">✕</span>` : ""}${addrText}</span>${link ? `<span class="ext" aria-hidden="true">↗</span>` : ""}`, "addr-link")}
            ${a.price ? `<span class="price-tag">${escapeHtml(a.price)} CHF</span>` : ""}
          </div>
          ${site ? `<div class="meta-line">${escapeHtml(site)}</div>` : ""}
        </div>
        <span class="badge" style="background:${st.color}">${st.label}</span>
      </div>
      ${!(canEdit && editingCards.has(a.id)) && a.notes ? `<div class="notes-view">${escapeHtml(a.notes)}</div>` : ""}
      ${canEdit && editingCards.has(a.id) ? `
      <div class="edit-box">
        <div class="fields-box">
          <input class="fieldInput field-address" data-field="address" value="${escapeHtml(a.address)}" placeholder="${t("phAddress")}" aria-label="${t("phAddress")}" autocomplete="off" />
          <input class="fieldInput" data-field="link" value="${escapeHtml(a.link)}" placeholder="${t("phLink")}" aria-label="${t("phLink")}" autocomplete="off" inputmode="url" />
          <input class="fieldInput" data-field="price" value="${escapeHtml(a.price)}" placeholder="${t("phPriceShort")}" aria-label="${t("phPriceShort")}" autocomplete="off" inputmode="numeric" />
        </div>
        <div class="card-controls">
          <select class="statusSelect" aria-label="${t("statusLabel")}">
            ${STATUSES.map(s => `<option value="${s.id}" ${s.id === a.status ? "selected" : ""}>${s.label}</option>`).join("")}
          </select>
          <button class="btn-ghost rejectBtn ${a.rejected ? "on" : ""}" aria-pressed="${!!a.rejected}">${a.rejected ? t("rejectOn") : t("rejectOff")}</button>
          <button class="btn-ghost approveBtn ${a.approved ? "on" : ""}" aria-pressed="${!!a.approved}">${a.approved ? t("approveOn") : t("approveOff")}</button>
          <button class="btn-ghost photoBtn">${t("addPhoto")}</button>
          ${photos.length ? `<button class="btn-danger removePhotoBtn">${t("removePhoto")}</button>` : ""}
          <input type="file" accept="image/*" multiple class="photoInput" style="display:none" />
        </div>
        <div class="notes-box">
          <textarea class="notesInput" placeholder="${t("phNotes")}">${escapeHtml(a.notes)}</textarea>
        </div>
        <div class="edit-footer">
          <button class="btn-danger deleteBtn">${t("deleteApt")}</button>
        </div>
      </div>` : ""}
      <div class="card-footer">
        <span class="updated-at">${updated ? t("updated", { d: updated }) : ""}</span>
        <button type="button" class="btn-ghost btn-sm editToggle edit-only">${editingCards.has(a.id) ? t("done") : t("edit")}</button>
      </div>
    </div>`;
  }).join("");

  listEl.querySelectorAll(".card").forEach(bindCard);
}

function bindCard(card) {
  const id = card.dataset.id;
  const selectEl = card.querySelector(".statusSelect");
  const notesEl = card.querySelector(".notesInput");
  const photoBtn = card.querySelector(".photoBtn");
  const photoInput = card.querySelector(".photoInput");
  const deleteBtn = card.querySelector(".deleteBtn");

  bindGallery(card, id);
  card.querySelector(".editToggle").addEventListener("click", () => {
    // Якщо нотатку чи поля ще не встигли зберегти — зберігаємо зараз.
    const apt = apartments.find(a => a.id === id);
    const pending = {};
    const ta = card.querySelector(".notesInput");
    if (ta && apt && ta.value !== (apt.notes || "")) pending.notes = ta.value;
    card.querySelectorAll(".fieldInput").forEach(inp => {
      const v = inp.value.trim();
      if (apt && v !== (apt[inp.dataset.field] || "")) pending[inp.dataset.field] = v;
    });
    if (apt && Object.keys(pending).length) { Object.assign(apt, pending); updateApartment(id, pending, false); }
    if (editingCards.has(id)) editingCards.delete(id); else editingCards.set(id, { rejected: !!apt?.rejected, approved: !!apt?.approved, status: apt?.status });
    editingNotes = null;
    renderList();
  });
  if (!selectEl) return; // картка не в режимі редагування

  selectEl.addEventListener("change", () => updateApartment(id, { status: selectEl.value }));

  // Назва, посилання, ціна: зберігаємо без перемальовування, щоб не збивати фокус.
  card.querySelectorAll(".fieldInput").forEach(inp => {
    let t;
    inp.addEventListener("focus", () => { editingNotes = id; });
    inp.addEventListener("blur", () => { editingNotes = null; });
    inp.addEventListener("input", () => {
      clearTimeout(t);
      t = setTimeout(() => updateApartment(id, { [inp.dataset.field]: inp.value.trim() }, false), 700);
    });
    inp.addEventListener("keydown", e => { if (e.key === "Enter") inp.blur(); });
  });

  let timer;
  notesEl.addEventListener("focus", () => { editingNotes = id; });
  notesEl.addEventListener("blur", () => { editingNotes = null; });
  notesEl.addEventListener("input", () => {
    clearTimeout(timer);
    timer = setTimeout(() => updateApartment(id, { notes: notesEl.value }, false), 700);
  });

  const approveBtn = card.querySelector(".approveBtn");
  approveBtn.addEventListener("click", () => {
    const cur = apartments.find(a => a.id === id);
    approveBtn.disabled = true;
    updateApartment(id, { approved: !cur?.approved });
  });

  const rejectBtn = card.querySelector(".rejectBtn");
  rejectBtn.addEventListener("click", () => {
    const cur = apartments.find(a => a.id === id);
    rejectBtn.disabled = true;
    updateApartment(id, { rejected: !cur?.rejected });
  });

  photoBtn.addEventListener("click", () => photoInput.click());
  photoInput.addEventListener("change", async () => {
    const files = [...(photoInput.files || [])];
    if (!files.length) return;
    photoBtn.disabled = true;
    try {
      const urls = await uploadPhotos(files, (i, n) => photoBtn.textContent = t("uploading", { i, n }));
      const current = photosOf(apartments.find(a => a.id === id));
      galleryIndex.set(id, current.length); // показати перше з нових
      await updateApartment(id, { photos: [...current, ...urls] });
    } catch (e) {
      showBanner(t("photoFailed", { e: e.message }), true);
      photoBtn.disabled = false;
      photoBtn.textContent = t("addPhoto");
    }
  });

  const removeBtn = card.querySelector(".removePhotoBtn");
  if (removeBtn) removeBtn.addEventListener("click", () => {
    if (removeBtn.dataset.armed !== "1") {
      removeBtn.dataset.armed = "1";
      removeBtn.textContent = t("confirmRemovePhoto");
      setTimeout(() => { if (removeBtn.isConnected) { removeBtn.dataset.armed = "0"; removeBtn.textContent = t("removePhoto"); } }, 3000);
      return;
    }
    const current = photosOf(apartments.find(a => a.id === id));
    const i = Math.min(galleryIndex.get(id) || 0, current.length - 1);
    galleryIndex.set(id, Math.max(0, i - 1));
    updateApartment(id, { photos: current.filter((_, k) => k !== i) });
  });

  deleteBtn.addEventListener("click", () => {
    if (deleteBtn.dataset.armed === "1") return deleteApartment(id);
    deleteBtn.dataset.armed = "1";
    deleteBtn.textContent = t("confirmDelete");
    setTimeout(() => { if (deleteBtn.isConnected) { deleteBtn.dataset.armed = "0"; deleteBtn.textContent = t("deleteApt"); } }, 3000);
  });
}

const editingCards = new Map(); // id карток, розгорнутих для редагування → її rejected/approved/status на момент відкриття
const galleryIndex = new Map(); // id квартири → номер показаного фото (переживає перемальовування)

function photosOf(a) {
  if (!a) return [];
  const list = Array.isArray(a.photos) ? a.photos : a.photoUrl ? [a.photoUrl] : [];
  return list.map(safeUrl).filter(Boolean);
}

// Гортання в картці: ліва/права третина фото, свайп. Тап по центру — перегляд на весь екран.
function bindGallery(card, id) {
  const g = card.querySelector(".gallery");
  if (!g) return;
  const apt = apartments.find(a => a.id === id);
  const photos = photosOf(apt);
  const img = g.querySelector(".photo");
  const dots = [...g.querySelectorAll(".dots i")];

  const show = (i) => {
    const n = photos.length;
    const next = ((i % n) + n) % n;
    galleryIndex.set(id, next);
    img.src = photos[next];
    dots.forEach((d, k) => d.classList.toggle("on", k === next));
  };
  const step = (d) => show((galleryIndex.get(id) || 0) + d);

  let swiped = false;
  img.addEventListener("click", () => {
    if (swiped) { swiped = false; return; }
    openLightbox(apt, galleryIndex.get(id) || 0, (i) => show(i));
  });

  if (photos.length < 2) return;
  g.querySelector(".prev").addEventListener("click", (e) => { e.preventDefault(); step(-1); });
  g.querySelector(".next").addEventListener("click", (e) => { e.preventDefault(); step(1); });
  onSwipe(g, (dir) => { swiped = true; step(dir); });

  // Підвантажуємо сусідні фото, щоб гортання було без затримки.
  photos.forEach(src => { const i = new Image(); i.src = src; });
}

// dir: 1 — наступне (свайп вліво), -1 — попереднє.
function onSwipe(el, cb) {
  let x0 = null, y0 = null;
  el.addEventListener("touchstart", (e) => { x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; }, { passive: true });
  el.addEventListener("touchend", (e) => {
    if (x0 === null) return;
    const dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0;
    if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)) cb(dx < 0 ? 1 : -1);
    x0 = null;
  });
}

// Модальний перегляд фото
const lb = {
  el: $("#lightbox"), img: $("#lbImg"), count: $("#lbCount"), title: $("#lbTitle"), thumbs: $("#lbThumbs"),
  photos: [], i: 0, onChange: null,
};
function lbShow(i) {
  const n = lb.photos.length;
  lb.i = ((i % n) + n) % n;
  lb.img.src = lb.photos[lb.i];
  lb.count.textContent = n > 1 ? `${lb.i + 1} / ${n}` : "";
  lb.thumbs.querySelectorAll("button").forEach((b, k) => b.classList.toggle("on", k === lb.i));
  lb.thumbs.querySelector("button.on")?.scrollIntoView({ block: "nearest", inline: "center" });
  lb.onChange?.(lb.i);
}
function openLightbox(apt, i, onChange) {
  lb.photos = photosOf(apt);
  if (!lb.photos.length) return;
  lb.onChange = onChange;
  lb.title.textContent = apt.address || "";
  const many = lb.photos.length > 1;
  $("#lbPrev").hidden = $("#lbNext").hidden = !many;
  lb.thumbs.hidden = !many;
  lb.thumbs.innerHTML = many ? lb.photos.map((src, k) => `<button type="button" data-k="${k}" aria-label="${t("photoN", { n: k + 1 })}"><img src="${escapeHtml(src)}" alt="" loading="lazy" /></button>`).join("") : "";
  lb.thumbs.querySelectorAll("button").forEach(b => b.addEventListener("click", () => lbShow(+b.dataset.k)));
  document.body.style.overflow = "hidden";
  lb.el.showModal();
  lbShow(i);
}
function closeLightbox() { if (lb.el.open) lb.el.close(); }
lb.el.addEventListener("close", () => { document.body.style.overflow = ""; lb.img.removeAttribute("src"); });
$("#lbClose").addEventListener("click", closeLightbox);
$("#lbPrev").addEventListener("click", () => lbShow(lb.i - 1));
$("#lbNext").addEventListener("click", () => lbShow(lb.i + 1));
// Клік по темному полю (не по фото й не по кнопках) — закрити.
$("#lbStage").addEventListener("click", (e) => { if (e.target.id === "lbStage") closeLightbox(); });
lb.el.addEventListener("keydown", (e) => {
  if (e.key === "ArrowLeft") { e.preventDefault(); lbShow(lb.i - 1); }
  if (e.key === "ArrowRight") { e.preventDefault(); lbShow(lb.i + 1); }
});
onSwipe($("#lbStage"), (dir) => lb.photos.length > 1 && lbShow(lb.i + dir));

async function uploadPhotos(files, onProgress) {
  const urls = [];
  for (let i = 0; i < files.length; i++) {
    onProgress?.(i + 1, files.length);
    const blob = await shrinkImage(files[i]);
    const { url } = await api("/api/photos", { method: "POST", headers: { "content-type": blob.type }, body: blob });
    urls.push(url);
  }
  return urls;
}

// Зменшуємо фото в браузері (до 1600px, JPEG), щоб не впертися в ліміт функції.
function shrinkImage(file, max = 1600) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, max / Math.max(img.width, img.height));
      const canvas = document.createElement("canvas");
      canvas.width = Math.round(img.width * scale);
      canvas.height = Math.round(img.height * scale);
      canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
      URL.revokeObjectURL(img.src);
      canvas.toBlob(b => b ? resolve(b) : reject(new Error(t("imgProcess"))), "image/jpeg", 0.85);
    };
    img.onerror = () => reject(new Error(t("imgRead")));
    img.src = URL.createObjectURL(file);
  });
}

function replaceLocal(apt) {
  const i = apartments.findIndex(a => a.id === apt.id);
  if (i >= 0) apartments[i] = apt; else apartments.unshift(apt);
}

async function updateApartment(id, patch, rerender = true) {
  try {
    const apt = await api(`/api/apartments/${encodeURIComponent(id)}`, {
      method: "PATCH", headers: { "content-type": "application/json" }, body: JSON.stringify(patch),
    });
    replaceLocal(apt);
    showBanner("");
    if (rerender) { renderFilters(); renderList(); }
  } catch (e) {
    showBanner(t("notSaved", { e: e.message }), true);
    load();
  }
}

async function deleteApartment(id) {
  try {
    await api(`/api/apartments/${encodeURIComponent(id)}`, { method: "DELETE" });
    apartments = apartments.filter(a => a.id !== id);
    renderFilters(); renderList();
  } catch (e) { showBanner(t("notDeleted", { e: e.message }), true); }
}

let pendingPhotos = []; // файли, вибрані у формі додавання

function renderPendingPhotos() {
  const box = $("#addThumbs");
  box.querySelectorAll("img").forEach(i => URL.revokeObjectURL(i.src));
  box.innerHTML = pendingPhotos.map((f, i) => `
    <div class="thumb"><img src="${URL.createObjectURL(f)}" alt="" /><button type="button" data-i="${i}" aria-label="${t("removeThumb")}">×</button></div>`).join("");
  box.querySelectorAll("button").forEach(b => b.addEventListener("click", () => {
    pendingPhotos.splice(+b.dataset.i, 1);
    renderPendingPhotos();
  }));
  updateAddPhotoBtn();
  $("#inPhoto").value = "";
}
function updateAddPhotoBtn() { $("#btnAddPhoto").textContent = pendingPhotos.length ? t("morePhoto") : t("addPhoto"); }
function showAddForm(on) {
  $("#addPanel").hidden = !on;
  $("#btnShowAdd").hidden = on;
  if (on) $("#inAddress").focus();
}
$("#btnShowAdd").addEventListener("click", () => showAddForm(true));
$("#btnHideAdd").addEventListener("click", () => showAddForm(false));

$("#btnAddPhoto").addEventListener("click", () => $("#inPhoto").click());
$("#inPhoto").addEventListener("change", () => {
  pendingPhotos.push(...$("#inPhoto").files);
  renderPendingPhotos();
});

$("#btnAdd").addEventListener("click", async () => {
  const body = {
    address: $("#inAddress").value.trim(),
    link: $("#inLink").value.trim(),
    price: $("#inPrice").value.trim(),
    notes: $("#inNotes").value.trim(),
  };
  if (!body.address && !body.link) return showBanner(t("needAddress"), true);
  const btn = $("#btnAdd");
  btn.disabled = true;
  try {
    if (pendingPhotos.length) {
      body.photos = await uploadPhotos(pendingPhotos, (i, n) => btn.textContent = t("uploadingAdd", { i, n }));
    }
    btn.textContent = t("saving");
    const apt = await api("/api/apartments", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) });
    replaceLocal(apt);
    ["#inAddress", "#inLink", "#inPrice", "#inNotes"].forEach(s => $(s).value = "");
    pendingPhotos = [];
    renderPendingPhotos();
    showAddForm(false);
    showBanner("");
    activeFilter = "all";
    renderFilters(); renderList();
  } catch (e) { showBanner(t("notAdded", { e: e.message }), true); }
  finally { btn.disabled = false; btn.textContent = t("add"); }
});

let connectionLost = false;
async function load() {
  try {
    const data = await api("/api/apartments");
    const changed = JSON.stringify(data) !== JSON.stringify(apartments);
    apartments = data;
    if (changed && !editingNotes) { renderFilters(); renderList(); }
    if (connectionLost) { connectionLost = false; showBanner(""); }
  } catch (e) {
    connectionLost = true;
    showBanner(t("noConnection", { e: e.message }), true);
  }
}

// Перемикач теми: як у системі → світла → темна → …
const THEMES = [
  { id: "auto",  icon: "🌓", get label() { return t("themeAuto"); } },
  { id: "light", icon: "☀️", get label() { return t("themeLight"); } },
  { id: "dark",  icon: "🌙", get label() { return t("themeDark"); } },
];
function applyTheme(id) {
  const t = THEMES.find(x => x.id === id) || THEMES[0];
  if (t.id === "auto") delete document.documentElement.dataset.theme;
  else document.documentElement.dataset.theme = t.id;
  const btn = $("#btnTheme");
  btn.textContent = t.icon;
  btn.title = btn.ariaLabel = t.label;
  store.set("apt-theme", t.id === "auto" ? null : t.id);
}
applyTheme(store.get("apt-theme") || "auto");
$("#btnTheme").addEventListener("click", () => {
  const cur = document.documentElement.dataset.theme || "auto";
  applyTheme(THEMES[(THEMES.findIndex(t => t.id === cur) + 1) % THEMES.length].id);
});

// Перемикач мови інтерфейсу; вибір запам'ятовується на цьому пристрої.
const langSelect = $("#langSelect");
langSelect.innerHTML = LANGS.map(l => `<option value="${l.id}" title="${l.name}">${l.label}</option>`).join("");
function applyLang(id) {
  lang = I18N[id] ? id : "ru";
  langSelect.value = lang;
  store.set("apt-lang", lang === "ru" ? null : lang);
  applyStaticI18n();
  updateModeTexts();
  updateAddPhotoBtn();
  applyTheme(document.documentElement.dataset.theme || "auto");
  renderFilters();
  if (apartments.length || listEl.querySelector(".card")) renderList();
}
langSelect.addEventListener("change", () => applyLang(langSelect.value));
applyLang(lang);

// Кнопка «наверх»: з'являється, коли прокрутили більше ніж на екран.
const toTop = $("#toTop");
const onScroll = () => toTop.classList.toggle("show", window.scrollY > window.innerHeight * 0.8);
window.addEventListener("scroll", onScroll, { passive: true });
onScroll();
toTop.addEventListener("click", () => window.scrollTo({ top: 0, behavior: "smooth" }));

checkAuth().then(load);
setInterval(() => { if (!document.hidden) load(); }, POLL_MS);
document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });
</script>
